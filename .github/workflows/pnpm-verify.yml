name: pnpm-verify
on:
  workflow_call:
    inputs:
      os:
        type: string
        required: false
        default: '["ubuntu-latest", "macos-latest", "windows-latest"]'
      node-version:
        type: string
        required: false
        default: '["lts/-1", "lts/*"]'
      pnpm-version:
        type: string
        required: false
      command:
        type: string
        required: false
        default: 'verify'
      codecov-flags:
        type: string
        required: false
      # Force-skip the Playwright browser install.
      #
      # Not normally needed: `setup-playwright` detects whether the consuming repo can
      # actually run Playwright and skips itself when it cannot, so a repo without
      # browser tests needs no input at all. This exists for the case where the repo
      # *does* have Playwright installed but this workflow should not spend time
      # downloading browsers, and for parity with cyberuni/.github's input of the same
      # name and semantics — repos move between the two orgs.
      skip-playwright:
        type: boolean
        required: false
        default: false
jobs:
  verify:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: ${{ fromJson(inputs.os) }}
        node-version: ${{ fromJson(inputs.node-version) }}
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
          cache: pnpm

      - name: Install Dependencies
        run: pnpm install

      - name: Install playwright browsers
        if: inputs.skip-playwright == false
        uses: repobuddy/.github/.github/actions/setup-playwright@v2

      - name: Verify
        if: matrix.os == 'ubuntu-latest'
        run: xvfb-run -a pnpm ${{ inputs.command }}
      - name: Verify
        if: matrix.os != 'ubuntu-latest'
        run: pnpm ${{ inputs.command }}

      - name: Archive snapshots
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: snapshots
          path: |
            **/__snapshots__/linux
            **/__vis__/**/__diffs__
            **/__vis__/**/__results__
      - name: codecov
        if: matrix.os == 'ubuntu-latest' && matrix.node-version == 'lts/*'
        uses: codecov/codecov-action@v7
        with:
          flags: ${{ inputs.codecov-flags }}

  all-checks:
    needs: [verify]
    runs-on: ubuntu-latest
    if: always()
    steps:
      - name: All checks passed
        run: |
          if [[ "${{ needs.verify.result }}" != "success" ]]; then
            exit 1
          fi
