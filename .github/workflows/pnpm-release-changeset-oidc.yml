name: pnpm-release-changeset-oidc
# Secretless variant of pnpm-release-changeset.yml.
#
# Differences from that workflow:
#   - No CI_GITHUB_TOKEN. The "version packages" PR is opened with a repobuddy GitHub
#     App token when the caller passes RELEASE_APP_ID and RELEASE_APP_PRIVATE_KEY. A PR
#     opened with GITHUB_TOKEN does not trigger `on: pull_request` workflows, so its
#     required checks never report and it can only be merged by an admin; the app token
#     does trigger them. An app key does not expire, so there is still nothing to rotate.
#     Without those secrets the job falls back to the built-in GITHUB_TOKEN with elevated
#     `permissions`, and the org must allow GitHub Actions to create pull requests.
#     Consumers whose pull-request.yml carries `branches-ignore: ['changeset-release/*']`
#     still skip those checks until they drop that filter.
#   - No NPM_TOKEN. Publishes via npm trusted publishing (OIDC), which also emits
#     provenance attestations. Each package must have a trusted publisher registered at
#     npmjs.com/package/<name>/access naming the repo and the *caller* workflow's
#     filename (release.yml), not this file. Publishing fails with a 404-style auth
#     error until that registration exists.
#
# Why bother, given this org does have a secret scope: CI_GITHUB_TOKEN and NPM_TOKEN are
# long-lived credentials that expire silently and are worth stealing. An expired
# NPM_TOKEN is the kind of failure nobody notices until a release has been missing from
# the registry for months. OIDC credentials are minted per run and last minutes.
#
# This is the v2 line, so it pairs changesets/action@v2 with @changesets/cli v3. The
# pairing is strict and enforced by the action itself: action v2 refuses to run against
# CLI v2. Consumers still on @changesets/cli v2 want the v1 tag of this repo instead.
# See README "Why there are two lines".
#
# Added alongside pnpm-release-changeset.yml rather than replacing it, so repos that have
# not registered trusted publishers keep working.
on:
  workflow_call:
    inputs:
      pnpm-version:
        type: string
        required: false
      node-version:
        type: string
        required: false
        default: '24'
    secrets:
      RELEASE_APP_ID:
        required: false
      RELEASE_APP_PRIVATE_KEY:
        required: false
    outputs:
      published:
        description: 'Whether the release was published'
        value: ${{ jobs.release.outputs.published }}

permissions:
  # Mints the OIDC token npm exchanges for short-lived publish credentials.
  id-token: write
  # Lets changesets/action push the version branch and tags.
  contents: write
  # Lets changesets/action open the "version packages" PR.
  pull-requests: write

concurrency: ${{ github.workflow }}-${{ github.ref }}

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      HAS_RELEASE_APP: ${{ secrets.RELEASE_APP_ID != '' && secrets.RELEASE_APP_PRIVATE_KEY != '' }}
      PLAYWRIGHT_PATH: ~/.cache/ms-playwright
    outputs:
      published: ${{ steps.changesets.outputs.published }}
    steps:
      - uses: actions/create-github-app-token@v3
        if: env.HAS_RELEASE_APP == 'true'
        id: app-token
        with:
          app-id: ${{ secrets.RELEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}

      # The version branch is pushed with the checkout's credentials, so the app token
      # goes here too; otherwise the push would not re-trigger the PR's checks.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          token: ${{ steps.app-token.outputs.token || github.token }}

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ inputs.node-version }}
          cache: pnpm
          registry-url: https://registry.npmjs.org

      # Trusted publishing requires npm 11.5.1+. Node LTS may ship an older npm.
      - name: Ensure npm supports trusted publishing
        run: |
          npm install -g npm@latest
          npm --version

      - name: Install Dependencies
        run: pnpm install

      - name: Install playwright browsers
        uses: repobuddy/.github/.github/actions/setup-playwright@v2

      - name: Install vsce
        run: pnpm install -g vsce

      - run: pnpm build

      # No .npmrc token step: the OIDC exchange supplies credentials at publish time.
      - name: Create Release Pull Request or Publish to npm
        id: changesets
        uses: changesets/action@v2.0.0
        with:
          github-token: ${{ steps.app-token.outputs.token || github.token }}
          commit-message: 'chore: version packages'
          version-script: pnpm run version
          publish-script: pnpm run release
        env:
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token || secrets.GITHUB_TOKEN }}
