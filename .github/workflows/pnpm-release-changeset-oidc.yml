name: pnpm-release-changeset-oidc
# Secretless variant of pnpm-release-changeset.yml.
#
# Differences from that workflow:
#   - No CI_GITHUB_TOKEN. Checkout and changesets/action both use the built-in
#     GITHUB_TOKEN with the caller's grant. GitHub starts no workflows for events
#     that token causes, so opening or pushing the "version packages" PR does not run
#     the caller's `on: pull_request` CI, and a ruleset that requires its checks leaves
#     the PR blocked. workflow_dispatch is the one event GITHUB_TOKEN may trigger, so
#     after changesets/action opens or updates the PR, this job runs
#     `gh workflow run <ci-workflow> --ref changeset-release/<branch>`. The check runs
#     from that dispatch attach to the branch head under the GitHub Actions app and
#     satisfy the required check by name. A GitHub App token would also work, but it
#     means a long-lived private key in org secrets; this needs no stored secret.
#
#     The caller must:
#       - grant `id-token: write`, `contents: write` and `pull-requests: write` to
#         the job that calls this workflow, plus `actions: write` for the dispatch.
#         This workflow declares no `permissions:` of its own, so the caller's grant
#         passes through unchanged. A block here would cap the token: every scope it
#         did not list, `actions` included, would drop to `none`, and the dispatch
#         would fail with 403 even when the caller grants `actions: write`. Listing
#         `actions: write` here instead would break every caller that does not grant
#         it, since a called workflow may not request more than its caller grants;
#       - list `workflow_dispatch:` in the `on:` block of its CI workflow
#         (`ci-workflow`, default pull-request.yml). Without it the dispatch fails; the
#         release still succeeds, but with a warning and a PR that has no checks.
#   - No NPM_TOKEN. Publishes via npm trusted publishing (OIDC), which also emits
#     provenance attestations. Each package must have a trusted publisher registered at
#     npmjs.com/package/<name>/access naming the repo and the *caller* workflow's
#     filename (release.yml), not this file. Publishing fails with a 404-style auth
#     error until that registration exists.
#
# Why bother, given this org does have a secret scope: CI_GITHUB_TOKEN and NPM_TOKEN are
# long-lived credentials that expire silently and are worth stealing. An expired
# NPM_TOKEN is the kind of failure nobody notices until a release has been missing from
# the registry for months. OIDC credentials are minted per run and last minutes.
#
# This is the v1 line, so it pairs changesets/action@v1 with @changesets/cli v2. The
# pairing is strict and enforced by the action itself: action v2 refuses to run against
# CLI v2, and directs you here. Consumers on @changesets/cli v3 want the v2 tag of this
# repo instead. See README "What counts as breaking".
#
# Added alongside pnpm-release-changeset.yml rather than replacing it, so repos that have
# not registered trusted publishers keep working.
on:
  workflow_call:
    inputs:
      ci-workflow:
        description: >
          The caller's CI workflow file, dispatched on the version branch after the
          "version packages" PR is opened or updated. It must list `workflow_dispatch:`.
        type: string
        required: false
        default: pull-request.yml
      pnpm-version:
        type: string
        required: false
      node-version:
        type: string
        required: false
        default: '24'
    outputs:
      published:
        description: 'Whether the release was published'
        value: ${{ jobs.release.outputs.published }}

concurrency: ${{ github.workflow }}-${{ github.ref }}

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      PLAYWRIGHT_PATH: ~/.cache/ms-playwright
    outputs:
      published: ${{ steps.changesets.outputs.published }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ inputs.node-version }}
          cache: pnpm
          registry-url: https://registry.npmjs.org

      # Trusted publishing requires npm 11.5.1+. Node LTS may ship an older npm.
      - name: Ensure npm supports trusted publishing
        run: |
          npm install -g npm@latest
          npm --version

      - name: Install Dependencies
        run: pnpm install

      - name: Install playwright browsers
        uses: repobuddy/.github/.github/actions/setup-playwright@v2

      - name: Install vsce
        run: pnpm install -g vsce

      - run: pnpm build

      # No .npmrc token step: the OIDC exchange supplies credentials at publish time.
      - name: Create Release Pull Request or Publish to npm
        id: changesets
        uses: changesets/action@v1
        with:
          commit: 'chore: version packages'
          version: pnpm run version
          publish: pnpm run release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # GITHUB_TOKEN-caused events start no workflows, so the version PR would never get
      # its required checks. Dispatch the caller's CI on the version branch instead; see
      # the header. A failed dispatch warns rather than failing an otherwise good release.
      - name: Start CI on the version packages PR
        if: steps.changesets.outputs.pullRequestNumber != '' && steps.changesets.outputs.published != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          CI_WORKFLOW: ${{ inputs.ci-workflow }}
          VERSION_BRANCH: changeset-release/${{ github.ref_name }}
        run: |
          if ! out=$(gh workflow run "$CI_WORKFLOW" --repo "$GITHUB_REPOSITORY" --ref "$VERSION_BRANCH" 2>&1); then
            echo "$out"
            if grep -qi 'workflow_dispatch' <<<"$out"; then
              echo "::warning::$CI_WORKFLOW has no workflow_dispatch trigger, so the version packages PR has no checks. Add 'workflow_dispatch:' to its 'on:' block."
            elif grep -qiE '403|Resource not accessible' <<<"$out"; then
              echo "::warning::GITHUB_TOKEN may not dispatch $CI_WORKFLOW, so the version packages PR has no checks. Grant 'actions: write' in the caller's 'permissions:' for the job that calls this workflow."
            else
              echo "::warning::Could not dispatch $CI_WORKFLOW on $VERSION_BRANCH, so the version packages PR has no checks. Check that the caller grants 'actions: write' and that ci-workflow names its CI workflow file."
            fi
          fi
